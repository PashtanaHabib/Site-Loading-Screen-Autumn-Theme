<!doctype html>
<html x-data="darkmode" lang="en" :class="{ 'dark': darkmode }">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pashtana Habib</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
      integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="main.css" />


  </head>
  <body class="dark-bg">
    <div class="body-cover">
      <!-- switch -->
      <div class="d-flex align-items-center justify-content-start p-4">
        <i class="bi bi-moon-fill fs-5 ms-2 lh-0 t-white"></i>
        <div class="form-check form-switch d-flex justify-content-center">
          <input
            x-model="darkmode"
            class="form-check-input dark-switch"
            type="checkbox"
            role="switch"
            id="switchCheckDefault"
          />
        </div>
        <i class="bi bi-brightness-high-fill fs-4 me-2 lh-0 t-white"></i>
      </div>
      <!-- header -->
       <header class="header">
        <div class="container">
          <div class="row text-center">
            <h2 class="fw-bold mb-4"><span class="spa">Lorem ipsum</span> <span id="text"></span></h2>
            <p class="lh-lg">Lorem ipsum dolor sit amet consectetur adipisicing elit. Recusandae fugit et, corrupti tempora exercitationem</p>
          </div>
        </div>
       </header>
    
    
    
    
    
    
    
    
    
    
    </div>
    

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.3/dist/cdn.min.js"
    ></script>

    <script src="https://unpkg.com/ityped@1.0.3"></script>
    <script>
      const textElement = document.querySelector('#text');
       ityped.init(textElement, { strings: ['dolor sit amet', 'onsectetur adipis ...' ] });
    </script>

    <script>
      document.addEventListener("alpine:init", () => {
        Alpine.data("darkmode", () => ({
          darkmode: false,

          init() {
            if (localStorage.theme === "dark") {
              this.darkmode = true;
            } else {
              this.darkmode = false;
            }

            this.$watch("darkmode", (value) => {
              if (value) {
                localStorage.theme = "dark";
              } else {
                localStorage.theme = "light";
              }
            });
          },
        }));
      });
    </script>
  </body>
</html>
